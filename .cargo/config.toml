# Cargo registry mirror — used when index.crates.io is unreachable.
# Change `replace-with` below to switch mirror (rebuild after edit).
#
#   rsproxy-sparse — https://rsproxy.cn (default)
#   ustc           — USTC sparse
#   tuna           — Tsinghua sparse
#
# Alt: copy a block to ~/.cargo/config.toml for all projects on this machine.

[source.crates-io]
# replace-with = "rsproxy-sparse"   # 2026-07-13: switched to direct crates.io (proxy now allows it)

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[source.tuna]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[registries.crates-io]
protocol = "sparse"

# Windows / flaky TLS: fewer mysterious connection failures (see USTC mirror FAQ).
[http]
multiplexing = false
check-revoke = false

# Windows MSVC main-thread stack: the linker default (~1 MB) is marginal for `kb`'s deeper
# search/index call paths and overflows under concurrent test load (e.g. the combined
# `cargo test -p glossa -p kb-eval` run spawning many `kb` subprocesses at once). Reserve 8 MB
# (Linux's default) so `kb`/`kbx` and every test binary get a comfortable main stack.
[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "link-arg=/STACK:8388608"]
