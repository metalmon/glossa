[package]
name = "kb-eval"
version = "0.2.2"
edition = "2021"

[lib]
name = "kb_eval"
path = "src/lib.rs"

[[bin]]
name = "convert-xlsx"
path = "src/bin/convert-xlsx.rs"

[[bin]]
name = "kbi"
path = "src/bin/kbi.rs"

[[bin]]
name = "kb-dump-episode"
path = "src/bin/kb-dump-episode.rs"

[[bin]]
name = "kbx"
path = "src/bin/kbx.rs"

[features]
# Marker, enabled by every feature that compiles an in-process engine. `kbi` and the scorer probes
# gate on THIS, never on a list of engine names. That list used to be spelled out at ~20 `cfg`
# sites across seven files, which is exactly how the pure-Rust burn engine ended up unable to build
# `kbi` at all: adding an engine meant editing twenty lists, and one was missed. Extend this in one
# place instead.
#
# It carries `glossa/tls` because the thing it unlocks is the SERVER, and the server's TLS/mTLS
# surface needs it. That used to hang off each of the four ORT execution-provider features
# separately — which held while only those features could build `kbi`, and broke the moment the CPU
# and Vulkan rows could too: they enabled the marker, compiled the server, and had no `glossa::tls`.
# Same lesson as the cfg list, one level up: a requirement of the server belongs on the one feature
# that says "a server exists here".
engine = ["glossa/tls", "dep:glossa-nli"]
# Off by default: pulls in glossa's CSP/marking-schema solver (glossa-constraint). Rare/opt-in
# path, exercised by `eval/tests/constraint_it.rs`.
constraint = ["glossa/constraint", "dep:glossa-constraint"]
# Off by default: builds `kbx nli check`'s real in-process ONNX scorer path (glossa-nli/ort). No
# new external dep here — this only forwards to glossa's own `nli` feature. Without it, `kbx nli
# check` still compiles and runs against the always-present `resolve_scorer` stub (`None` ⇒
# AC-only); with it, a real model can load. See `just build-kb-constraint` for the analogous
# opt-in pattern.
nli = ["glossa/nli", "engine"]
# Light remote HTTP scorer clients for `kbx nli/rerank check --endpoint` (forwards to glossa's
# `http-scorer`: ureq + serde, no ORT). Independent of the engine features.
http-scorer = ["glossa/http-scorer"]
# GPU passthrough for glossa-nli's execution-provider features (see glossa-nli/Cargo.toml). Cargo
# cannot CLI-enable a transitive dependency's feature (`cargo build -p kb-eval --features
# glossa/nli-cuda` is not valid), so kb-eval carries a DIRECT optional `glossa-nli` dep (below)
# purely so these features have something local to name. Cargo's feature unification then gives
# the ONE shared `glossa-nli` instance (the one `glossa` itself depends on) the union of what's
# enabled here and via `glossa`'s own feature(s), so `glossa`'s `InProcessNli` compiles against
# the right linking strategy — without `glossa`'s own Cargo.toml ever carrying a GPU feature
# (that's what keeps `cargo test -p glossa --all-features` on the self-contained CPU path).
#
# `nli-directml`/`nli-coreml` stay on the bundled (self-contained) linking strategy: they pull in
# `nli` (=> `glossa/nli` => glossa-nli's `nli-ort-bundled`) plus the EP feature.
nli-directml = ["nli", "dep:glossa-nli", "glossa-nli/nli-directml"]
nli-coreml = ["nli", "dep:glossa-nli", "glossa-nli/nli-coreml"]
# `nli-cuda`/`nli-rocm` need the runtime `load-dynamic` linking strategy instead (ort's
# `download-binaries` archive doesn't ship these providers — validated locally: a
# `download-binaries` CUDA build silently ran on CPU). They pull in `glossa/nli-dynamic` (glossa's
# CODE-ONLY path, no linking) rather than `nli`/`glossa/nli`, so the shared glossa-nli instance
# resolves to `nli-ort + nli-cuda` = `nli-ort-dynamic` (load-dynamic) ONLY — no bundled
# `download-binaries` pulled in alongside it. Build with e.g.
# `cargo build -p kb-eval --features nli-cuda` (bring an `onnxruntime-gpu` dll via
# `ORT_DYLIB_PATH` at runtime).
nli-cuda = ["glossa/nli-dynamic", "dep:glossa-nli", "glossa-nli/nli-cuda", "engine"]
nli-rocm = ["glossa/nli-dynamic", "dep:glossa-nli", "glossa-nli/nli-rocm", "engine"]
# Pure-Rust burn/wgpu engine (Plan 4) — a DIFFERENT engine, mutually exclusive with the ORT features
# above. Pulls `glossa/nli-burn` (the burn adapter + resolve_scorer branch, no backend) and supplies
# the backend on the shared glossa-nli instance: `nli-burn` = Vulkan/SPIR-V GPU (production, run with
# only a Vulkan driver present); `nli-burn-cpu` = NdArray (CI/tests, no GPU). Do NOT combine with
# `nli`/`nli-cuda`/... (the ORT XOR burn `compile_error!` in glossa-nli would fire).
nli-burn = ["glossa/nli-burn", "dep:glossa-nli", "glossa-nli/nli-burn-vulkan", "engine"]
nli-burn-cpu = ["glossa/nli-burn", "dep:glossa-nli", "glossa-nli/nli-burn-cpu", "engine"]

[dependencies]
glossa = { path = ".." }
glossa-constraint = { path = "../constraint", optional = true }
# Direct optional dep. Two jobs: it gives the `nli-cuda`/`nli-directml`/`nli-coreml` passthrough
# features (above) a local crate name to enable a feature on, and it is what `kbi` and the fit
# paths name directly (`glossa_nli::Nli`, `load_nli`, the harness constants). It therefore hangs
# off the `engine` marker rather than off each engine feature: a row that compiles the server has
# to be able to SAY `glossa_nli`, and the CPU row proved the point by enabling the marker through
# plain `nli` and then failing to resolve the crate. Cargo's feature unification is what gives
# this the same instance glossa itself depends on, with the union of both sides' features — see
# the `nli-cuda` feature comment above for the full mechanism.
glossa-nli = { path = "../glossa-nli", optional = true, default-features = false }
anyhow = "1"
regex = "1"
toml = "1.1"
# Edit-in-place `ontology.toml` writes (`calibrate::write_threshold`) that preserve unrelated
# tables/comments — plain `toml`'s round-trip loses formatting the `toml` crate doesn't model.
toml_edit = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Chat backend HTTP client (openai.rs `chat_http`). Raw JSON round-trip preserves provider-specific
# fields like MiMo's `reasoning_content` that a typed SDK would drop. reqwest 0.13 defaults to
# rustls (no OpenSSL).
reqwest = { version = "0.13", features = ["json"] }
# Shared multi-thread runtime so the (still-sync) agent loop can `block_on` reqwest's async calls.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
axum = "0.8"
uuid = { version = "1", features = ["v7"] }
rand = "0.8"
rand_chacha = "0.3"
base64 = "0.22"
calamine = "0.26"
tempfile = "3"
indicatif = "0.17"
# Port of Python json_repair — heal truncated / messy LLM tool-call arguments.
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
# `tracing::warn!` — the endpoint-headers ${{session}}-missing warn-once (transport/openai.rs).
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Deterministic mtimes in `calibrate::latest_run` tests instead of racing a coarse-granularity
# Windows FS clock with thread::sleep (same rationale as the root crate's freshen tests).
filetime = "0.2"
