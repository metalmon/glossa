[package]
name = "kb-eval"
version = "0.2.2"
edition = "2021"

[lib]
name = "kb_eval"
path = "src/lib.rs"

[[bin]]
name = "kb-eval"
path = "src/main.rs"

[[bin]]
name = "kb-train"
path = "src/bin/kb-train.rs"

[[bin]]
name = "kb-eval-constraint"
path = "src/bin/kb-eval-constraint.rs"
required-features = ["constraint"]

[[bin]]
name = "convert-xlsx"
path = "src/bin/convert-xlsx.rs"

[[bin]]
name = "kb-dump-episode"
path = "src/bin/kb-dump-episode.rs"

[[bin]]
name = "kbx"
path = "src/bin/kbx.rs"

[features]
# Off by default: pulls in glossa's CSP/marking-schema solver (glossa-constraint) plus the
# kb-eval constraint tooling (constraint_score/constraint_synthetic/gepa_constraint/
# export_tz_constraint + the kb-eval-constraint bin). Rare/opt-in path; see `just build-kb-constraint`
# and `just build-train-constraint`.
constraint = ["glossa/constraint", "dep:glossa-constraint"]
# Off by default: builds `kbx nli check`'s real in-process ONNX scorer path (glossa-nli/ort). No
# new external dep here — this only forwards to glossa's own `nli` feature. Without it, `kbx nli
# check` still compiles and runs against the always-present `resolve_scorer` stub (`None` ⇒
# AC-only); with it, a real model can load. See `just build-kb-constraint` for the analogous
# opt-in pattern.
nli = ["glossa/nli"]
# GPU passthrough for glossa-nli's execution-provider features (see glossa-nli/Cargo.toml). Cargo
# cannot CLI-enable a transitive dependency's feature (`cargo build -p kb-eval --features
# glossa/nli-cuda` is not valid), so kb-eval carries a DIRECT optional `glossa-nli` dep (below)
# purely so these features have something local to name. Cargo's feature unification then gives
# the ONE shared `glossa-nli` instance (the one `glossa` itself depends on) `nli-ort + nli-cuda`,
# so `glossa`'s `InProcessNli` compiles with CUDA support — without `glossa`'s own Cargo.toml ever
# carrying a GPU feature (that's what keeps `cargo test -p glossa --all-features` CPU-only). Build
# with e.g. `cargo build -p kb-eval --features nli-cuda`.
nli-cuda = ["nli", "dep:glossa-nli", "glossa-nli/nli-cuda"]
nli-directml = ["nli", "dep:glossa-nli", "glossa-nli/nli-directml"]
nli-coreml = ["nli", "dep:glossa-nli", "glossa-nli/nli-coreml"]

[dependencies]
glossa = { path = ".." }
glossa-constraint = { path = "../constraint", optional = true }
# Direct optional dep purely to give the `nli-cuda`/`nli-directml`/`nli-coreml` passthrough
# features (above) a local crate name to enable a feature on — kb-eval never calls glossa-nli
# directly (it only ever goes through `glossa::gate`/`resolve_scorer`); Cargo's feature
# unification is what makes this reach the shared instance glossa itself depends on. See the
# `nli-cuda` feature comment above for the full mechanism.
glossa-nli = { path = "../glossa-nli", optional = true }
anyhow = "1"
regex = "1"
toml = "1.1"
# Edit-in-place `ontology.toml` writes (`calibrate::write_threshold`) that preserve unrelated
# tables/comments — plain `toml`'s round-trip loses formatting the `toml` crate doesn't model.
toml_edit = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Chat backend HTTP client (openai.rs `chat_http`). Raw JSON round-trip preserves provider-specific
# fields like MiMo's `reasoning_content` that a typed SDK would drop. reqwest 0.13 defaults to
# rustls (no OpenSSL).
reqwest = { version = "0.13", features = ["json"] }
# Shared multi-thread runtime so the (still-sync) agent loop can `block_on` reqwest's async calls.
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }
rand = "0.8"
rand_chacha = "0.3"
base64 = "0.22"
bzip2 = "0.4"
tar = "0.4"
calamine = "0.26"
tempfile = "3"
ctrlc = "3"
indicatif = "0.17"
# Port of Python json_repair — heal truncated / messy LLM tool-call arguments.
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
# `tracing::warn!` — the endpoint-headers ${{session}}-missing warn-once (transport/openai.rs).
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Deterministic mtimes in `calibrate::latest_run` tests instead of racing a coarse-granularity
# Windows FS clock with thread::sleep (same rationale as the root crate's freshen tests).
filetime = "0.2"
