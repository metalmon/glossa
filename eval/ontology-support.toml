# Support-domain ontology overlay for glossa (technical-support knowledge base).
#
# THIN troubleshooting skeleton, matching the baked `support` preset
# (templates/ontologies/support.toml): the graph holds ONLY the reasoning path
# (Symptom→Cause→Resolution and Task→Resolution). Entities/context (products,
# modules, parameters, versions, media, standards) live in the file-first docs,
# NOT as node types — reifying them over-models and adds noise without lifting
# reader answers. Core node types (Document, Section) and core edges
# (CONTAINS, MENTIONS, NEXT, PREV) are BUILT IN by the structural indexer.

# ── Entities (the reasoning nodes — nothing else) ──
[entities.Symptom]    # an observed problem / question class (keep BROAD)
id_prefix = "sym"
props = []
[entities.Cause]      # a root cause
id_prefix = "cau"
props = []
[entities.Resolution] # an action / fix / answer-pattern
id_prefix = "res"
props = []
requires_grounding = true
[entities.Task]       # a how-to intent
id_prefix = "tsk"
props = []

# ── Relations (the reasoning spine) ──
[relations.CAUSED_BY]
from = ["Symptom"]
to = ["Cause"]
role = "chaining"
[relations.RESOLVED_BY]
from = ["Cause", "Task"]
to = ["Resolution"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Symptom", relations = ["CAUSED_BY", "RESOLVED_BY"] },
  { anchor = "Task",    relations = ["RESOLVED_BY"] },
]
closure = [["CAUSED_BY", "RESOLVED_BY", "RESOLVED_BY"]]
mentions = "MENTIONS"
