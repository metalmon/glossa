# kbx lab config — model/judge/reflect/distil endpoints for the file-first eval toolkit.
# The target root is NOT configured here: it is resolved from kb-style PATH (the .glossa root),
# the same way `kb` itself resolves it — pass a path explicitly, or run from inside
# (or under) the workspace.
#
# `endpoint` is the FULL chat-completions URL, used verbatim (nothing is appended). For a local
# LM Studio server that is `http://localhost:1234/v1/chat/completions`; for a hosted provider use
# its complete `.../v1/chat/completions` URL.

# [model] is the DEFAULT endpoint — the eval reader and every stage without its own section use it.
# Per-stage endpoint fallback graph (each stage's own section wins; otherwise it falls back here):
#   reason  -> [reason]  -> [distil] -> (none: `kbx reason` errors without one)
#   build   -> [build]   -> [model]
#   bridge  -> [bridge]  -> [model]
#   distil  -> [distil]  (standalone; no fallback)
#   judge   -> [judge]   (standalone; skipped when unset)
#   reflect -> [reflect] (standalone; `kbx train` only)
[model]
endpoint = "http://localhost:1234/v1/chat/completions"
model = "qwen3.5-4b"
# api_key = "sk-..."                 # inline key, OR:
# api_key_env = "OPENAI_API_KEY"     # read the key from this env var (keeps the secret out of this file)
timeout_secs = 120
# api = "openai"                     # wire format: "openai" (default) | "anthropic" | "openai_responses"
# temperature = 0.7                  # optional sampling temperature; OMIT to use the provider/model
                                     # default. The KB_EVAL_TEMP env var overrides this at every
                                     # call site. Settable per endpoint (any section below).

# OPT-IN rate-limit + retry policy for THIS endpoint. OMIT the whole `[<stage>.rate_limit]` table
# (the default) to keep today's behavior EXACTLY: no throttle, and 4 retry attempts with a
# 400ms*attempt linear backoff. Any subset of the four knobs may be set; unset knobs keep the
# historical defaults. Settable under any endpoint section (e.g. `[judge.rate_limit]`).
# [model.rate_limit]
# rpm = 60             # max requests/minute (min-interval 60000/rpm ms between request starts)
# max_inflight = 4     # max concurrent in-flight requests to this endpoint
# retry = 4            # total attempts on a transient failure (429 / 5xx / transport drop). Default 4.
# backoff_ms = 400     # linear backoff base: attempt n sleeps backoff_ms*n. Default 400.

# OPT-IN fallback chain: on a HARD failure of this endpoint (retries exhausted / 5xx / timeout /
# connect error) the resilience layer advances through these fallbacks IN ORDER, each with its OWN
# `api`/`rate_limit`. FLAT chain — a fallback's own `fallback` is IGNORED (never recursed). Primary
# success never touches a fallback. OMIT (the default) for no fallback. Repeat the block per link.
# [[model.fallback]]
# endpoint = "http://localhost:1234/v1/chat/completions"   # e.g. a local model backing a flaky cloud primary
# model = "qwen3.5-4b"
# timeout_secs = 120
# [model.fallback.rate_limit]      # each fallback link may carry its own rate-limit/retry policy
# retry = 2

# [build]                              # override the harvest model for `kbx build`; falls back to [model]
# endpoint = "http://localhost:1234/v1/chat/completions"
# model = "qwen3.5-4b"
# timeout_secs = 120

# [judge]                              # may be a DIFFERENT endpoint / model / key / timeout
# endpoint = "http://localhost:1234/v1/chat/completions"
# model = "qwen3.5-4b"
# timeout_secs = 60

# [reflect]                            # prompt-reflection endpoint for `kbx train`
# endpoint = "http://localhost:1234/v1/chat/completions"
# model = "qwen3.5-4b"
# timeout_secs = 120

# [distil]                             # strong-model endpoint shared by `kbx reason` and `kbx distil`
# endpoint = "http://localhost:1234/v1/chat/completions"
# model = "big-model"
# timeout_secs = 300

# [reason]                             # phase-2 backward-synthesis endpoint for `kbx reason`;
# endpoint = "http://localhost:1234/v1/chat/completions"   # its own model, separate from build/distil.
# model = "big-model"                  # Falls back to [distil] when unset (then errors if neither is set).
# timeout_secs = 300

# [bridge]                             # cheap binary cross-doc-link judge for `kbx build` stage 3
# endpoint = "http://localhost:1234/v1/chat/completions"   # ("is this a real link?" per candidate pair).
# model = "qwen3.5-4b"                 # A small/fast model suffices. Falls back to [model] when unset.
# timeout_secs = 120

# Every endpoint section above accepts the SAME fields as [model]: api / temperature /
# [<section>.rate_limit] / [[<section>.fallback]]. Only [model] is required; the rest are optional
# and fall back per the graph at the top — omit any you don't need and its default applies.

# [user_sim]                           # OPT-IN simulated-user dialogue gate for the eval/train reader.
                                       # When set, a text-only reader turn that only restates the
                                       # question (instead of answering) is deflected back into the
                                       # loop by a patient simulated user (persona: user_sim.md) that
                                       # paces the reader and never reveals a fact; the loop returns
                                       # only once the reader actually answers. OMIT this section to
                                       # keep today's behavior exactly (a text-only turn is the answer).
# endpoint = "http://localhost:1234/v1/chat/completions"
# model = "qwen3.5-4b"
# timeout_secs = 60
# temperature = 0.7

[tuning]                              # reason/build/distil/eval agent-loop tuning knobs.
                                       # Precedence: CLI flag > this section > built-in default.
fanout_max = 3          # predecessors synthesized per backward step (reason)
max_rounds = 30         # agent-loop rounds per unit (reason / build / distil)
chunks_per_round = 3    # sections read per round (build / distil)
jobs_build = 3          # worker-pool size for `kbx build`'s extract/judge stages
jobs_reason = 3         # worker-pool size for `kbx reason`'s seed workers
jobs_train = 3          # worker-pool size for `kbx train`'s read-only rollouts
jobs_distil = 3         # worker-pool size for `kbx distil`'s densify workers
jobs_eval = 3           # worker-pool size for `kbx eval`'s per-case reader+judge
