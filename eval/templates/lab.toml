# kbx lab config — per-workspace settings for the file-first eval toolkit.
# Relative paths below (corpus, and everything under [defaults]) resolve against this file's
# own directory; absolute paths are used as-is.

# Path to the glossa corpus this workspace evaluates against (must already be `kb index`ed).
corpus = "../corpus"

[model]
endpoint = "http://localhost:1234"
model = "qwen3.5-4b"
# api_key = "sk-..."                 # inline key, OR:
# api_key_env = "OPENAI_API_KEY"     # read the key from this env var (keeps the secret out of this file)
timeout_secs = 120

[judge]                              # may be a DIFFERENT endpoint / model / key / timeout
endpoint = "http://localhost:1234"
model = "qwen3.5-4b"
# api_key = "..."
timeout_secs = 60

[defaults]
prompt = "answer.md"
judge_prompt = "judge.md"
dataset = "dataset.toml"
