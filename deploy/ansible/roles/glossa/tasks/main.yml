---
# The archive name is glossa-{version}-{target}-{engine}; the engine part is what the host must
# already be able to run. Validate the pair before the download so a wrong engine names the valid
# ones instead of arriving as a 404 from get_url.
- name: Assert the target and engine name a published release archive
  ansible.builtin.assert:
    that:
      - glossa_engine in (glossa_engines_by_target[glossa_target] | default([]))
    fail_msg: >-
      No release archive is published for {{ glossa_target }}-{{ glossa_engine }}.
      Engines published for {{ glossa_target }}:
      {{ (glossa_engines_by_target[glossa_target] | default([])) | join(', ') | default('none - this target has no release archive', true) }}
    quiet: true

- name: Create glossa system user
  ansible.builtin.user:
    name: "{{ glossa_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ glossa_install_dir }}"
    create_home: false

- name: Create install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ glossa_install_dir }}"
    - "{{ glossa_bin_dir }}"

- name: Create corpus directory
  ansible.builtin.file:
    path: "{{ glossa_corpus_path }}"
    state: directory
    owner: "{{ glossa_user }}"
    group: "{{ glossa_group }}"
    mode: "0755"

- name: Download glossa release archive
  ansible.builtin.get_url:
    url: "https://github.com/{{ glossa_repo }}/releases/download/v{{ glossa_version }}/{{ glossa_stem }}.tar.gz"
    dest: "/tmp/{{ glossa_stem }}.tar.gz"
    mode: "0644"

- name: Extract kb binary
  ansible.builtin.unarchive:
    src: "/tmp/{{ glossa_stem }}.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/{{ glossa_stem }}/kb"

- name: Install kb binary
  ansible.builtin.copy:
    src: "/tmp/{{ glossa_stem }}/kb"
    dest: "{{ glossa_bin_dir }}/kb"
    mode: "0755"
    remote_src: true

- name: Install systemd unit
  ansible.builtin.template:
    src: glossa-mcp.service.j2
    dest: /etc/systemd/system/glossa-mcp.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart glossa-mcp

- name: Enable and start glossa-mcp
  ansible.builtin.systemd:
    name: glossa-mcp
    enabled: true
    state: started
    daemon_reload: true

- name: Run initial index if .glossa missing
  ansible.builtin.command:
    cmd: "{{ glossa_bin_dir }}/kb index {{ glossa_corpus_path }}"
  become: true
  become_user: "{{ glossa_user }}"
  args:
    creates: "{{ glossa_corpus_path }}/.glossa/manifest.json"
