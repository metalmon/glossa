name: tests

# Standalone TEST workflow, runnable on ANY branch (unlike ci.yml, which is
# master/main-only). Triggers on every push and PR, plus manual dispatch, so a
# feature branch can be verified without opening a PR to master first.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Format + lint gate on EVERY branch (ci.yml runs these only on master/main, so a feature
      # branch would otherwise merge unlinted). `cargo fmt --check` is OS-independent → run once on
      # Linux; clippy runs on the full matrix so Windows-`cfg` code is linted too. `-D warnings`
      # matches ci.yml.
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `http-scorer` clients (HttpNli/HttpReranker + the kbx remote probes) are feature-gated
      # and off by default, so the workspace clippy above never sees them — lint them explicitly.
      - name: cargo clippy (http-scorer feature, -D warnings)
        run: |
          cargo clippy -p glossa --all-targets --locked --features http-scorer -- -D warnings
          cargo clippy -p kb-eval --all-targets --locked --features http-scorer -- -D warnings

      # Lean release config — NO default features (no notebook, no constraint): exactly what the
      # release binary ships, so nothing outside a feature may hard-depend on notebook/constraint.
      - name: cargo test (glossa, no default features — release config)
        run: cargo test -p glossa --release --locked --no-default-features

      # Full build — every feature EXCEPT the mutually-exclusive burn engine. `--all-features` is
      # no longer usable here: glossa now has two mutually-exclusive NLI engines (`nli`/`nli-dynamic`
      # = ONNX Runtime, XOR `nli-burn` = burn/wgpu), and `--all-features` would enable BOTH → a
      # glossa-nli `compile_error!`. This explicit set is the old `--all-features` minus `nli-burn`
      # (ORT engine + notebook + e2e + lingua + constraint + tls); the burn engine is covered by its
      # own job below. Covers the `tls` handshake/mTLS/reload tests on both matrix OSes (§3b).
      # `http-scorer` is exercised in its own steps below (on its own, and combined with `tls`).
      - name: cargo test (glossa, all features except burn engine)
        run: cargo test -p glossa --release --locked --features "notebook e2e lingua constraint nli nli-dynamic tls"

      # `http-scorer` on its own (no tls): the remote NLI/reranker clients (HttpNli/HttpReranker)
      # and the multi-backend reranker wire. Single rustls provider (ureq's ring), so no clash.
      - name: cargo test (glossa, http-scorer feature)
        run: cargo test -p glossa --release --locked --no-default-features --features http-scorer

      # Provider-coexistence guard: `tls` + `http-scorer` in ONE build link TWO rustls providers
      # (tls's aws-lc-rs + ureq's ring). `tls.rs` names the provider explicitly at every builder, so
      # the tls handshake/mTLS tests must still pass here — before the explicit fix they panicked
      # with "no process-level CryptoProvider". This is the regression guard for that fix.
      - name: cargo test (glossa, tls + http-scorer provider coexistence)
        run: |
          cargo test -p glossa --release --locked --features "tls http-scorer" tls::

      - name: cargo test (kb-eval)
        run: cargo test -p kb-eval --release --locked

      # kb-eval's opt-in `constraint` feature (CSP / marking-schema tooling + kb-eval-constraint bin).
      - name: cargo test (kb-eval, constraint feature)
        run: cargo test -p kb-eval --release --locked --features constraint

      # kb-eval's `http-scorer` feature: the `kbx rerank/nli check --endpoint` remote probes and the
      # kbi server's wire round-trip against the shared client parser.
      - name: cargo test (kb-eval, http-scorer feature)
        run: cargo test -p kb-eval --release --locked --features http-scorer

      # burn/wgpu NLI engine (Plan 4). Mutually exclusive with the ORT engine, so it gets its own
      # jobs on the NdArray CPU backend (no GPU runner — the GPU/Vulkan path is validated locally on
      # real hardware). Lints + tests the burn engine, then verifies the full glossa/kb-eval wiring
      # (adapter + resolve_scorer + eval passthrough) compiles under the burn engine.
      - name: cargo clippy (burn engine, CPU backend)
        run: cargo clippy -p glossa-nli --no-default-features --features nli-burn-cpu --all-targets --locked -- -D warnings

      - name: cargo test (glossa-nli, burn engine, CPU backend)
        run: cargo test -p glossa-nli --release --locked --no-default-features --features nli-burn-cpu

      - name: cargo build (kb-eval, burn engine wiring, CPU backend)
        run: cargo build -p kb-eval --release --locked --features nli-burn-cpu
