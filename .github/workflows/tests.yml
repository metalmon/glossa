name: tests

# Standalone TEST workflow, runnable on ANY branch (unlike ci.yml, which is
# master/main-only). Triggers on every push and PR, plus manual dispatch, so a
# feature branch can be verified without opening a PR to master first.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Format + lint gate on EVERY branch (ci.yml runs these only on master/main, so a feature
      # branch would otherwise merge unlinted). `cargo fmt --check` is OS-independent → run once on
      # Linux; clippy runs on the full matrix so Windows-`cfg` code is linted too. `-D warnings`
      # matches ci.yml.
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Lean release config — NO default features (no notebook, no constraint): exactly what the
      # release binary ships, so nothing outside a feature may hard-depend on notebook/constraint.
      - name: cargo test (glossa, no default features — release config)
        run: cargo test -p glossa --release --locked --no-default-features

      # Full build — every feature (notebook + lingua + constraint + tls). Covers the `tls`
      # feature's handshake/mTLS/reload tests on both matrix OSes (§3b).
      - name: cargo test (glossa, all features)
        run: cargo test -p glossa --release --locked --all-features

      - name: cargo test (kb-eval)
        run: cargo test -p kb-eval --release --locked

      # kb-eval's opt-in `constraint` feature (CSP / marking-schema tooling + kb-eval-constraint bin).
      - name: cargo test (kb-eval, constraint feature)
        run: cargo test -p kb-eval --release --locked --features constraint
