name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting gate: the whole tree must be `cargo fmt`-clean.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Lint gate: no clippy warnings anywhere (lib, bins, tests). Warnings are denied so a new
      # lint can't slip in unnoticed.
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Whole-workspace compile check (ubuntu only). Retries transient registry failures.
      - name: cargo check (workspace)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo check --workspace --release --locked; then
              exit 0
            fi
            echo "cargo check failed (attempt ${attempt}/3), retrying in 15s..."
            sleep 15
          done
          exit 1

      # Lean release config — NO default features (no notebook, no constraint). This is exactly what
      # the release binary ships, so CI guards it: nothing outside a feature may hard-depend on
      # notebook/constraint, and no test may assume those tools without a `#[cfg(feature = …)]` gate.
      - name: cargo test (glossa, no default features — release config)
        run: cargo test -p glossa --release --locked --no-default-features

      # Full build — every feature (notebook + lingua + constraint).
      - name: cargo test (glossa, all features)
        run: cargo test -p glossa --release --locked --all-features

      - name: cargo test (kb-eval)
        run: cargo test -p kb-eval --release --locked

      # kb-eval's `constraint` feature (CSP/marking-schema tooling) is opt-in and off by
      # default — exercise it explicitly so CI still covers glossa-constraint + the
      # kb-eval-constraint bin.
      - name: cargo test (kb-eval, constraint feature)
        run: cargo test -p kb-eval --release --locked --features constraint
