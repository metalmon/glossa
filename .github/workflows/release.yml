name: Release

on:
  push:
    tags:
      - "v*"
  # Manual build-only run: produces the release-profile binaries as downloadable
  # workflow ARTIFACTS without cutting a GitHub Release (the publish job below is
  # gated to tag pushes). Use to deploy a release-quality kbx/kb without a version bump.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail-fast quality gate: no release binary is ever built from code that doesn't pass fmt+clippy.
  # For a tag push this is redundant with ci.yml (already green before the tag) but cheap; for a
  # manual workflow_dispatch build it is the ONLY thing standing between a red commit and a shipped
  # artifact. `build` runs only if this passes.
  lint:
    name: fmt + clippy (fail-fast gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.target }} · ${{ matrix.engine }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per (platform, engine). The engine name lands in the archive filename, because that
      # is the only thing an operator has to choose. `none` is `--no-default-features` (no
      # `notebook`, no ML deps); every other row keeps DEFAULT features, since prod relies on
      # `notebook`, and adds exactly one engine (`constraint` stays opt-in either way).
      #
      # How the engines differ, because it decides what has to exist on the target machine:
      #   directml / coreml — ONNX Runtime, self-contained (ort's bundled `download-binaries`):
      #                       nothing to install. DirectML is all-vendor on Windows.
      #   cpu               — the same bundled ONNX Runtime, no GPU provider.
      #   cuda13            — ONNX Runtime `load-dynamic`; the GPU libraries are fetched and
      #                       bundled beside the binary (steps below), pinned by digest and matched
      #                       to ort 2.0.0-rc.13 (ORT 1.28.2). Still needs CUDA 13 + cuDNN 9 on the
      #                       target, plus `ORT_DYLIB_PATH` pointing at the bundled runtime.
      #   rocm              — ONNX Runtime `load-dynamic` with NOTHING bundled: Microsoft publishes
      #                       no ROCm build of ONNX Runtime, so the operator supplies one.
      #   vulkan            — not ONNX Runtime at all: the pure-Rust burn engine on Vulkan/SPIR-V.
      #                       Needs only a driver, works on any vendor, bundles nothing.
      #
      # Every Linux row builds on ubuntu-22.04, NOT ubuntu-latest. The runner's glibc is the floor
      # the binary demands: 24.04 emits GLIBC_2.39 references, and the deployment targets do not
      # have it (Astra Linux 1.8 and Debian 12 carry 2.36 or less) — `kb` there dies with
      # "weak version `GLIBC_2.39' not found" before it prints its own version. 22.04 means 2.35,
      # below both. Do not move these rows to ubuntu-latest.
      matrix:
        include:
          # `engine` used to read `ort` on three rows that are three DIFFERENT engines (DirectML,
          # CoreML, plain CPU) — and it is the filename an operator picks from, so it now names the
          # engine instead.
          #
          # No engine at all: BM25 retrieval only. `kbi` cannot exist here — it has nothing to serve.
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, archive: tar.gz, engine: none, kb_flags: "--no-default-features", kbx_flags: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip,    engine: none, kb_flags: "--no-default-features", kbx_flags: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz, engine: none, kb_flags: "--no-default-features", kbx_flags: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,      archive: tar.gz, engine: none, kb_flags: "--no-default-features", kbx_flags: "" }
          # ONNX Runtime, SELF-CONTAINED: the provider rides ort's bundled download, nothing to
          # install on the target.
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip,    engine: directml, kb_flags: "--features nli-directml", kbx_flags: "--features nli-directml", build_server: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz, engine: coreml,   kb_flags: "--features nli-coreml",   kbx_flags: "--features nli-coreml",   build_server: true }
          # NOTE: no x86_64-apple-darwin engine row — ort-sys ships no `download-binaries` ONNX
          # Runtime for Intel Mac ("no prebuilt binaries available for target x86_64-apple-darwin"),
          # so a self-contained build is impossible there. Intel Mac gets the `none` variant only.
          # NOTE: no Linux `cpu` row. It is the one engine that LINKS ONNX Runtime at build time
          # (`nli` -> ort's `download-binaries`), and the archive ort downloads is built against
          # glibc 2.38: on 22.04 it fails to link (`undefined symbol: __isoc23_strtoll`), and built
          # on 24.04 it demands 2.38 at runtime, which the deployment targets do not have. The
          # shared ONNX Runtime from Microsoft's own release needs only 2.27, which is why every
          # load-dynamic row below is fine. To bring this row back, build it load-dynamic
          # (`glossa/nli-dynamic`, a provider-less `nli-dynamic` row in eval/) and bundle
          # Microsoft's CPU `libonnxruntime.so` beside the binary the way cuda13 does. Until then
          # `cuda13` covers the CPU case: with no card its provider fails to initialise and ONNX
          # Runtime falls back to the CPU execution provider.
          # ONNX Runtime, LOAD-DYNAMIC: nothing is linked at build time, so the GPU-capable runtime
          # travels with the archive (cuda13, fetched below) or is supplied by the operator (rocm).
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip,    engine: cuda13, kb_flags: "--features nli-cuda", kbx_flags: "--features nli-cuda", build_server: true }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, archive: tar.gz, engine: cuda13, kb_flags: "--features nli-cuda", kbx_flags: "--features nli-cuda", build_server: true }
          # ROCm ships no runtime of its own: Microsoft publishes NO ROCm build of ONNX Runtime for
          # any platform (the 1.28.2 release carries linux/win CUDA 12 and 13 and nothing else), so
          # this row is the binary only and the operator points `ORT_DYLIB_PATH` at a ROCm-enabled
          # ONNX Runtime they built. Linux only — AMD on Windows is DirectML's job, above.
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, archive: tar.gz, engine: rocm,   kb_flags: "--features nli-rocm", kbx_flags: "--features nli-rocm", build_server: true }
          # The pure-Rust engine: burn with the Vulkan/SPIR-V backend. NOT ONNX Runtime at all, so
          # there is nothing to install or bundle — any vendor's card with a Vulkan driver. This is
          # the practical answer for AMD, where no ROCm runtime is published. `kb` names the backend
          # through glossa's own `nli-burn-vulkan` (its `nli-burn` is code-only); `kbx` gets it from
          # kb-eval's `nli-burn`. No `build_server` yet: `kbi` still holds concrete ORT types, so it
          # joins these rows with the change that makes the server engine-agnostic.
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, archive: tar.gz, engine: vulkan, kb_flags: "--features nli-burn-vulkan", kbx_flags: "--features nli-burn", build_server: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip,    engine: vulkan, kb_flags: "--features nli-burn-vulkan", kbx_flags: "--features nli-burn", build_server: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.engine }}   # one cache per engine — the dependency graphs differ

      - name: Build kb
        run: cargo build --release --locked --target ${{ matrix.target }} -p glossa --bin kb ${{ matrix.kb_flags }}

      - name: Build kbx
        # kbx is the file-first eval/train/build toolkit (lives in the kb-eval crate).
        run: cargo build --release --locked --target ${{ matrix.target }} -p kb-eval --bin kbx ${{ matrix.kbx_flags }}

      - name: Build kbi
        # The standalone HTTP scorer (NLI + reranker over TEI/Jina). `build_server` now marks every
        # row that HAS an engine, which is every row but `none`: the server gates on the `engine`
        # marker feature and holds `glossa_nli::Nli`/`Reranker`, which resolve to whichever engine
        # the build compiled. A `none` row still cannot have it — there is nothing to serve.
        if: matrix.build_server
        run: cargo build --release --locked --target ${{ matrix.target }} -p kb-eval --bin kbi ${{ matrix.kbx_flags }}

      - name: Fetch ONNX Runtime CUDA-13 DLLs (Windows cuda13)
        # nli-cuda uses ort's `load-dynamic`: nothing is linked/downloaded at build time, so the
        # GPU-capable ONNX Runtime must be supplied at RUNTIME. Fetch the ORT 1.28 CUDA-13 build
        # (matches ort 2.0.0-rc.13's ORT 1.28 target) and drop its DLLs beside the binary — the
        # Windows package step below copies `onnxruntime*.dll` from the release dir into the zip.
        if: matrix.engine == 'cuda13' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.28.2"
          # Pinned SHA-256 of onnxruntime-win-x64-gpu_cuda13-1.28.2.zip (GitHub release asset
          # digest). Verified after download so a tampered/substituted archive fails the build
          # instead of shipping an unverified GPU dll (supply-chain integrity).
          $sha = "4B7A2D01A3CC96B12D06C8266AF2C8F42C96365C4A0100D45FD874C71B4A2E19"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-gpu_cuda13-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile ort-gpu.zip
          $got = (Get-FileHash ort-gpu.zip -Algorithm SHA256).Hash
          if ($got -ne $sha) { Write-Error "ORT GPU zip SHA256 mismatch: expected $sha, got $got"; exit 1 }
          Write-Host "ORT GPU zip SHA256 verified"
          Expand-Archive -Path ort-gpu.zip -DestinationPath ort-gpu -Force
          $dst = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # Only the ONNX Runtime DLLs (onnxruntime.dll + onnxruntime_providers_*.dll). CUDA/cuDNN
          # runtime libs are NOT bundled (licensing) — they come from the target's CUDA 13 + cuDNN 9.
          Get-ChildItem -Recurse ort-gpu -Filter "onnxruntime*.dll" | Copy-Item -Destination $dst -Force
          Get-ChildItem "$dst/onnxruntime*.dll" | ForEach-Object { Write-Host "bundled: $($_.Name)" }

      - name: Fetch ONNX Runtime CUDA-13 shared libraries (Linux cuda13)
        # Same reasoning as the Windows step above, different archive shape: the Linux asset is a
        # .tgz of `lib/libonnxruntime*.so*`. Dropped beside the binary, where the Unix package step
        # below already copies `libonnxruntime*.so*` into the tarball. The digest is the GitHub
        # release asset digest, verified after download so a substituted archive fails the build
        # instead of shipping an unverified GPU library.
        if: matrix.engine == 'cuda13' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver="1.28.2"
          sha="118ca8dbc4e4bb9b3b7fea137d796a89d957c9aa70e1dc3a5199a302cdd5bb32"
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-gpu_cuda13-${ver}.tgz"
          curl -fsSL -o ort-gpu.tgz "$url"
          echo "${sha}  ort-gpu.tgz" | sha256sum -c -
          echo "ORT GPU tgz SHA256 verified"
          mkdir -p ort-gpu && tar -xzf ort-gpu.tgz -C ort-gpu --strip-components=1
          dst="target/${{ matrix.target }}/release"
          mkdir -p "$dst"
          # Only the ONNX Runtime libraries. CUDA/cuDNN runtime libs are NOT bundled (licensing) —
          # they come from the target's CUDA 13 + cuDNN 9, exactly as on Windows.
          find ort-gpu -name 'libonnxruntime*.so*' -exec cp -P {} "$dst/" \;
          ls -1 "$dst"/libonnxruntime*.so* | sed 's/^/bundled: /'

      - name: Note the runtime ROCm needs (rocm only)
        # This row bundles no ONNX Runtime at all, because none is published for ROCm. Say so inside
        # the archive rather than letting the operator discover it from a load failure.
        if: matrix.engine == 'rocm'
        run: |
          cat > ENGINE-NOTES.txt <<'EOF'
          ROCm build — the ONNX Runtime is NOT included.

          Microsoft publishes no ROCm build of ONNX Runtime, so this archive carries the glossa
          binaries only. To use the GPU you must supply a ROCm-enabled ONNX Runtime yourself and
          point ORT_DYLIB_PATH at it:

              export ORT_DYLIB_PATH=/path/to/libonnxruntime.so

          Without it, scoring falls back to the CPU silently — `kbx nli check <corpus>` and
          `kbx rerank check --model-dir <dir>` report `ep_active`, which is how you tell.

          If building ONNX Runtime from source is not something you want to own, prefer the
          `vulkan` archive: it is a pure-Rust engine that needs only a Vulkan driver, works on any
          vendor, and bundles nothing.
          EOF

      - name: Package the NVIDIA runtime the cuda13 build needs (Linux cuda13)
        # The glossa archive carries ONNX Runtime but not NVIDIA's own libraries (see the fetch
        # step above), so the cuda13 build only runs where CUDA 13 + cuDNN 9 are already installed
        # — a provisioning job nobody on an air-gapped site can do. So publish exactly the five
        # libraries `objdump -p libonnxruntime_providers_cuda.so` asks for as their own asset:
        #   libcudart, libcublas, libcublasLt, libcurand   (CUDA 13 redistributables)
        #   libcudnn                                       (cuDNN 9, the cuda13 build)
        # `libcuda.so.1` is deliberately NOT here: it ships with the driver and is tied to it.
        # Separate archive on purpose — nothing is mixed into the upstream ONNX Runtime artifact,
        # and whoever has a provisioned machine just does not download it. Unpruned for now:
        # `nvprune` would cut libcublas by an order of magnitude, but only once the target GPU
        # architecture is known.
        if: matrix.engine == 'cuda13' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          cuda_ver="13.4.2"
          cudnn_ver="9.27.0"
          base="https://developer.download.nvidia.com/compute"
          work="$(mktemp -d)"
          # Resolve names and digests from the manifests instead of pinning URLs by hand: NVIDIA's
          # component versions move independently of the CUDA version they ship with.
          curl -fsSL -o "$work/cuda.json"  "$base/cuda/redist/redistrib_${cuda_ver}.json"
          curl -fsSL -o "$work/cudnn.json" "$base/cudnn/redist/redistrib_${cudnn_ver}.json"
          fetch() { # fetch <which> <jq-path>
            rel="$(jq -r "$2.relative_path" "$work/$1.json")"
            sha="$(jq -r "$2.sha256" "$work/$1.json")"
            [ "$rel" != null ] || { echo "manifest has no $2" >&2; exit 1; }
            echo "==> $rel"
            curl -fsSL -o "$work/$(basename "$rel")" "$base/$1/redist/$rel"
            echo "${sha}  $work/$(basename "$rel")" | sha256sum -c -
            tar -xf "$work/$(basename "$rel")" -C "$work"
          }
          fetch cuda  '.cuda_cudart."linux-x86_64"'
          fetch cuda  '.libcublas."linux-x86_64"'
          fetch cuda  '.libcurand."linux-x86_64"'
          fetch cudnn '.cudnn."linux-x86_64".cuda13'
          tag="${GITHUB_REF_NAME#v}"; tag="${tag//\//-}"
          stem="glossa-${tag}-${{ matrix.target }}-cuda13-nvidia-runtime"
          mkdir -p "dist/${stem}"
          # Only the shared objects the provider links against: the static libs, headers and docs
          # in those archives are most of their bulk and none of the need. -P keeps the soname
          # symlinks (libcublas.so.13 -> libcublas.so.13.x.y) the loader resolves through.
          find "$work" -path '*/lib/*' \( -name 'libcudart.so*' -o -name 'libcublas.so*' \
            -o -name 'libcublasLt.so*' -o -name 'libcurand.so*' -o -name 'libcudnn*.so*' \) \
            -exec cp -P {} "dist/${stem}/" \;
          cat > "dist/${stem}/README.md" <<'EOF'
          # NVIDIA runtime for the glossa `cuda13` build

          The `cuda13` archive carries ONNX Runtime but not NVIDIA's own libraries. These are them:
          `libcudart`, `libcublas`, `libcublasLt`, `libcurand` (CUDA 13 redistributables) and
          `libcudnn` (cuDNN 9, the cuda13 build).

          Unpack beside `kb`, or anywhere on the loader path:

              tar -xzf glossa-*-cuda13-nvidia-runtime.tar.gz
              export LD_LIBRARY_PATH="$PWD/glossa-<version>-x86_64-unknown-linux-gnu-cuda13-nvidia-runtime:$LD_LIBRARY_PATH"

          `libcuda.so.1` is NOT here on purpose: it comes with the NVIDIA driver and is tied to the
          driver version on the machine.

          To check it took: `kbx nli check <corpus>` reports `ep_active`.
          EOF
          tar -czf "dist/${stem}.tar.gz" -C dist "${stem}"
          rm -rf "dist/${stem}"
          ls -la dist/*.tar.gz | sed 's/^/packaged: /'

      - name: Package the NVIDIA runtime the cuda13 build needs (Windows cuda13)
        # Windows half of the Linux step above: the same five libraries, as DLLs. ONNX Runtime
        # travels inside the cuda13 archive; NVIDIA's own libraries do not, and a Windows host
        # with a card but no CUDA toolkit has nowhere to get them.
        if: matrix.engine == 'cuda13' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cuda_ver="13.4.2"
          cudnn_ver="9.27.0"
          base="https://developer.download.nvidia.com/compute"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/cuda.json"  "$base/cuda/redist/redistrib_${cuda_ver}.json"
          curl -fsSL -o "$work/cudnn.json" "$base/cudnn/redist/redistrib_${cudnn_ver}.json"
          fetch() { # fetch <which> <jq-path>
            rel="$(jq -r "$2.relative_path" "$work/$1.json")"
            sha="$(jq -r "$2.sha256" "$work/$1.json")"
            [ "$rel" != null ] || { echo "manifest has no $2" >&2; exit 1; }
            echo "==> $rel"
            curl -fsSL -o "$work/$(basename "$rel")" "$base/$1/redist/$rel"
            echo "${sha}  $work/$(basename "$rel")" | sha256sum -c -
            # The Windows redistributables are zips, not tarballs.
            unzip -q -o "$work/$(basename "$rel")" -d "$work"
          }
          fetch cuda  '.cuda_cudart."windows-x86_64"'
          fetch cuda  '.libcublas."windows-x86_64"'
          fetch cuda  '.libcurand."windows-x86_64"'
          fetch cudnn '.cudnn."windows-x86_64".cuda13'
          tag="${GITHUB_REF_NAME#v}"; tag="${tag//\//-}"
          stem="glossa-${tag}-${{ matrix.target }}-cuda13-nvidia-runtime"
          mkdir -p "dist/${stem}"
          find "$work" -path '*/bin/*' \( -name 'cudart64_*.dll' -o -name 'cublas64_*.dll' \
            -o -name 'cublasLt64_*.dll' -o -name 'curand64_*.dll' -o -name 'cudnn*.dll' \) \
            -exec cp {} "dist/${stem}/" \;
          cat > "dist/${stem}/README.md" <<'EOF'
          # NVIDIA runtime for the glossa `cuda13` build (Windows)

          The `cuda13` archive carries ONNX Runtime but not NVIDIA's own libraries. These are them:
          `cudart64_*`, `cublas64_*`, `cublasLt64_*`, `curand64_*` (CUDA 13 redistributables) and
          `cudnn*` (cuDNN 9, the cuda13 build).

          Unpack them next to `kb.exe`, or anywhere on `PATH`. The NVIDIA driver itself is not here:
          it comes with the display driver installed on the machine.

          To check it took: `kbx nli check <corpus>` reports `ep_active`.
          EOF
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/${stem}' -DestinationPath 'dist/${stem}.zip' -Force"
          rm -rf "dist/${stem}"
          ls -la dist/*.zip | sed 's/^/packaged: /'

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag//\//-}"   # sanitize slashes so a branch dispatch (feat/x) yields a flat name
          stem="glossa-${tag}-${{ matrix.target }}-${{ matrix.engine }}"
          mkdir -p "dist/${stem}"
          cp "target/${{ matrix.target }}/release/kb" "dist/${stem}/"
          cp "target/${{ matrix.target }}/release/kbx" "dist/${stem}/"
          # kbi exists only on GPU-EP rows (build_server); the copy no-ops elsewhere.
          cp "target/${{ matrix.target }}/release/kbi" "dist/${stem}/" 2>/dev/null || true
          # ort/bundled may place a shared ONNX Runtime lib beside the binary — ship it if present
          # (no-op for the `none` variant and for static links).
          cp target/${{ matrix.target }}/release/libonnxruntime*.dylib "dist/${stem}/" 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libonnxruntime*.so* "dist/${stem}/" 2>/dev/null || true
          cp README.md LICENSE "dist/${stem}/"
          # Present only on rows that bundle no runtime of their own (rocm); no-op elsewhere.
          cp ENGINE-NOTES.txt "dist/${stem}/" 2>/dev/null || true
          tar -czf "dist/${stem}.tar.gz" -C dist "${stem}"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = ("${{ github.ref_name }}" -replace '^v', '') -replace '/', '-'  # flat name for branch dispatch
          $stem = "glossa-${tag}-${{ matrix.target }}-${{ matrix.engine }}"
          New-Item -ItemType Directory -Force -Path "dist/$stem"
          Copy-Item "target/${{ matrix.target }}/release/kb.exe" "dist/$stem/"
          Copy-Item "target/${{ matrix.target }}/release/kbx.exe" "dist/$stem/"
          # kbi.exe exists only on GPU-EP rows (build_server); the copy no-ops elsewhere.
          Get-ChildItem "target/${{ matrix.target }}/release/kbi.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist/$stem/"
          # ort/bundled may place onnxruntime*.dll beside the binary — ship it if present.
          Get-ChildItem "target/${{ matrix.target }}/release/onnxruntime*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist/$stem/"
          Copy-Item README.md, LICENSE "dist/$stem/"
          Compress-Archive -Path "dist/$stem" -DestinationPath "dist/$stem.zip"

      # A SECOND, binaries-only zip for the cuda13 row. The full zip above is ~260 MB, and ~100 MB of
      # that is the ONNX Runtime GPU DLLs fetched above — which are pinned to the `ort` version, not
      # to our code, so they are byte-identical between builds. A machine that already ran a cuda13
      # build has them beside the binaries with `ORT_DYLIB_PATH` pointing at them, so redeploying
      # needs the three executables and nothing else.
      #
      # Kept as a SEPARATE artifact rather than replacing the full one: the full zip is the drop-in
      # thing a release publishes, and shipping binaries that cannot find an ONNX Runtime would break
      # that promise. This one is for `gh run download` on an already-provisioned box.
      - name: Package (Windows, binaries only — cuda13)
        if: matrix.engine == 'cuda13' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = ("${{ github.ref_name }}" -replace '^v', '') -replace '/', '-'
          $stem = "glossa-${tag}-${{ matrix.target }}-${{ matrix.engine }}-binsonly"
          New-Item -ItemType Directory -Force -Path "dist-bins/$stem"
          Copy-Item "target/${{ matrix.target }}/release/kb.exe"  "dist-bins/$stem/"
          Copy-Item "target/${{ matrix.target }}/release/kbx.exe" "dist-bins/$stem/"
          Get-ChildItem "target/${{ matrix.target }}/release/kbi.exe" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "dist-bins/$stem/"
          Copy-Item README.md, LICENSE "dist-bins/$stem/"
          Compress-Archive -Path "dist-bins/$stem" -DestinationPath "dist-bins/$stem.zip"
          "{0:N1} MB (full zip stays the drop-in artifact)" -f ((Get-Item "dist-bins/$stem.zip").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: glossa-${{ matrix.target }}-${{ matrix.engine }}
          path: |
            dist/*.tar.gz
            dist/*.zip

      # Named OUTSIDE the `glossa-*` namespace on purpose: the release job downloads `glossa-*` only,
      # so this never becomes a published release asset.
      - uses: actions/upload-artifact@v4
        if: matrix.engine == 'cuda13' && runner.os == 'Windows'
        with:
          name: binsonly-${{ matrix.target }}-${{ matrix.engine }}
          path: dist-bins/*.zip

  release:
    name: publish GitHub Release
    needs: build
    # Publish ONLY on a version tag push; a manual workflow_dispatch build stops at
    # artifacts (no Release created).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # `glossa-*` only: the cuda13 row also uploads a `binsonly-*` artifact (executables without
          # the ONNX Runtime DLLs) for redeploys onto an already-provisioned machine. That one must
          # NOT become a release asset — downloaded from a Release it would look drop-in and fail to
          # find an ONNX Runtime at startup.
          pattern: glossa-*
          merge-multiple: true

      # Publish with retry: the GitHub release API intermittently returns a
      # transient HTML error page instead of JSON (this failed the v0.1.1 run
      # after all four archives had already built). Create the release on first
      # run, upload/clobber assets on retries, up to five attempts.
      - name: Publish release (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" dist/* --clobber; then exit 0; fi
            else
              if gh release create "$TAG" dist/* --generate-notes; then exit 0; fi
            fi
            echo "publish failed (attempt ${attempt}/5), retrying in 15s..."
            sleep 15
          done
          echo "publish failed after 5 attempts" >&2
          exit 1
