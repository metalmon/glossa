[meta]
domain = "decision-log"
description = "Architecture/decision records: decision -> chosen and considered options -> driving criteria."
family = "decision"
tier = 2
aliases = ["adr"]

[entities.Decision]
id_prefix = "dec"
props = []
requires_grounding = true
[entities.Option]
id_prefix = "opt"
props = []
[entities.Criterion]
id_prefix = "crt"
props = []

[relations.CHOOSES]
from = ["Decision"]
to = ["Option"]
role = "chaining"
[relations.CONSIDERED]
from = ["Decision"]
to = ["Option"]
role = "chaining"
[relations.DRIVEN_BY]
from = ["Decision"]
to = ["Criterion"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Decision", relations = ["CHOOSES"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
