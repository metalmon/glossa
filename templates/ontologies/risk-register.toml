[meta]
domain = "risk-register"
description = "Enterprise risk register: risk -> root cause -> mitigating control."
family = "risk"
tier = 1
aliases = ["erm"]

[entities.Risk]
id_prefix = "rsk"
props = []
[entities.Cause]
id_prefix = "cau"
props = []
[entities.Control]
id_prefix = "ctl"
props = []
requires_grounding = true

[relations.CAUSED_BY]
from = ["Risk"]
to = ["Cause"]
role = "chaining"
[relations.MITIGATED_BY]
from = ["Cause"]
to = ["Control"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Risk", relations = ["CAUSED_BY", "MITIGATED_BY"] },
]
closure = [["CAUSED_BY", "MITIGATED_BY", "MITIGATED_BY"]]
mentions = "MENTIONS"
