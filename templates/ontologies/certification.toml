[meta]
domain = "certification"
description = "Product conformity assessment: product -> technical regulation -> test, grounded and time-bound in the text."
note = "Test.valid_from/valid_to state when the test (e.g. a test result or certificate) actually holds in the world, i.e. its validity/expiry period; this is distinct from provenance (when the test was recorded or filed). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["conformity"]

[entities.Product]
id_prefix = "prd"
props = []
[entities.TechReg]
id_prefix = "trg"
props = []
[entities.Test]
id_prefix = "tst"
props = []
requires_grounding = true
requires_validity = true

[relations.SUBJECT_TO]
from = ["Product"]
to = ["TechReg"]
role = "chaining"
[relations.REQUIRES_TEST]
from = ["TechReg"]
to = ["Test"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "TechReg", relations = ["REQUIRES_TEST"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
