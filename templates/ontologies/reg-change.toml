[meta]
domain = "reg-change"
description = "Regulatory change watch: standard supersession chains and their downstream impact."
note = "Requirement.valid_from/valid_to and Standard.valid_from/valid_to state when the requirement or standard edition actually applies/is in force in the world (e.g. the effective period of a given revision); this is distinct from provenance (when the standard text was published or the requirement was recorded). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["regwatch"]

[entities.Requirement]
id_prefix = "req"
props = []
requires_grounding = true
requires_validity = true
[entities.Standard]
id_prefix = "std"
props = []
requires_grounding = true
requires_validity = true
[entities.Impacted]
id_prefix = "imp"
props = []
requires_grounding = true

[relations.SUPERSEDES]
from = ["Standard", "Requirement"]
to = ["Standard", "Requirement"]
[relations.DEFINED_IN]
from = ["Requirement"]
to = ["Standard"]
[relations.AFFECTS]
from = ["Requirement"]
to = ["Impacted"]

[validation]
strict = true

[reasoning]
closure = [["SUPERSEDES", "SUPERSEDES", "SUPERSEDES"]]
mentions = "MENTIONS"
