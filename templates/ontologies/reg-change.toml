[meta]
domain = "reg-change"
description = "Regulatory change watch: standard supersession chains and their downstream impact."
note = "Requirement.valid_from/valid_to state when the requirement actually applies/is in force in the world (e.g. the effective period of a given revision); this is distinct from provenance (when the requirement was recorded). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["regwatch"]

[entities.Requirement]
id_prefix = "req"
props = []
requires_grounding = true
requires_validity = true
[entities.Standard]
id_prefix = "std"
props = []
[entities.Impacted]
id_prefix = "imp"
props = []

[relations.SUPERSEDES]
from = ["Standard", "Requirement"]
to = ["Standard", "Requirement"]
role = "chaining"
[relations.DEFINED_IN]
from = ["Requirement"]
to = ["Standard"]
role = "chaining"
[relations.AFFECTS]
from = ["Requirement"]
to = ["Impacted"]
role = "chaining"

[validation]
strict = true

[reasoning]
closure = [["SUPERSEDES", "SUPERSEDES", "SUPERSEDES"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
