[meta]
domain = "policy"
description = "Policy / handbook management: policy -> rule -> exception."
family = "governance"
tier = 1
aliases = ["handbook", "regulation"]

[entities.Policy]
id_prefix = "pol"
props = []
[entities.Rule]
id_prefix = "rul"
props = []
requires_grounding = true
[entities.Exception]
id_prefix = "exc"
props = []

[relations.DEFINES]
from = ["Policy"]
to = ["Rule"]
role = "chaining"
[relations.HAS_EXCEPTION]
from = ["Rule"]
to = ["Exception"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Policy", relations = ["DEFINES"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
