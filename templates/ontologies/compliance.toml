[meta]
domain = "compliance"
description = "Check a document against normative requirements: requirement -> constrained field, grounded in the text."
family = "compliance"
tier = 1
aliases = ["normocontrol", "conformance", "normative"]

[entities.NormativeRequirement]  # one checkable requirement pulled from a standard/spec
id_prefix = "req"
props = []
[entities.Field]                 # a constrained parameter of the checked document
id_prefix = "fld"
props = []
requires_grounding = true

[relations.CONSTRAINS]
from = ["NormativeRequirement"]
to = ["Field"]
role = "chaining"
[relations.CONSTRAINED_BY]
from = ["Field"]
to = ["Range", "Regex", "Enum", "Required", "Forbidden"]
role = "attribute"
[relations.HAS_MIN]
from = ["Range"]
to = ["Literal"]
role = "attribute"
[relations.HAS_MAX]
from = ["Range"]
to = ["Literal"]
role = "attribute"
[relations.HAS_PATTERN]
from = ["Regex"]
to = ["Literal"]
role = "attribute"

[validation]
strict = true

[constraint_types.Range]
params = ["min", "max"]
[constraint_types.Regex]
params = ["pattern"]
[constraint_types.Enum]
params = ["values"]
[constraint_types.Required]
params = []
[constraint_types.Forbidden]
params = []

[entities.Literal]
id_prefix = "lit"
props = []

[reasoning]
spines = [
  { anchor = "NormativeRequirement", relations = ["CONSTRAINS"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
