[meta]
domain = "vendor"
description = "Vendor management: contracts, SLAs, third-party risk, and supply chains."
family = "procurement"
tier = 2
aliases = ["tprm", "supply-chain", "procurement"]

[entities.Vendor]
id_prefix = "ven"
props = []
[entities.Service]
id_prefix = "svc"
props = []
[entities.Contract]
id_prefix = "ctr"
props = []
requires_grounding = true
[entities.Sla]
id_prefix = "sla"
props = []

[relations.PROVIDES]
from = ["Vendor"]
to = ["Service"]
role = "chaining"
[relations.GOVERNS]
from = ["Contract"]
to = ["Service"]
role = "chaining"
[relations.HAS_SLA]
from = ["Contract"]
to = ["Sla"]
role = "chaining"
[relations.SUBCONTRACTS]
from = ["Vendor"]
to = ["Vendor"]
role = "chaining"

[validation]
strict = true

[reasoning]
closure = [["SUBCONTRACTS", "SUBCONTRACTS", "SUBCONTRACTS"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
