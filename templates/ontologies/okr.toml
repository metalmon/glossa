[meta]
domain = "okr"
description = "Objectives and key results: objective -> key result -> advancing initiative."
family = "strategy"
tier = 2
aliases = ["goals"]

[entities.Objective]
id_prefix = "obj"
props = []
requires_grounding = true
[entities.KeyResult]
id_prefix = "kr"
props = []
[entities.Initiative]
id_prefix = "ini"
props = []

[relations.MEASURED_BY]
from = ["Objective"]
to = ["KeyResult"]
role = "chaining"
[relations.ADVANCED_BY]
from = ["KeyResult"]
to = ["Initiative"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Objective", relations = ["MEASURED_BY"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
