[meta]
domain = "faq"
description = "Frequently asked questions: question -> answer, related questions, superseded answers."
family = "knowledge"
tier = 2
aliases = ["knowledge-base"]

[entities.Question]
id_prefix = "qst"
props = []
[entities.Answer]
id_prefix = "ans"
props = []
requires_grounding = true

[relations.ANSWERED_BY]
from = ["Question"]
to = ["Answer"]
role = "chaining"
[relations.RELATED_TO]
from = ["Question"]
to = ["Question"]
role = "chaining"
[relations.SUPERSEDES]
from = ["Answer"]
to = ["Answer"]
role = "chaining"

[validation]
strict = true

[reasoning]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
