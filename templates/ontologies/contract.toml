[meta]
domain = "contract"
description = "Contract lifecycle management: clause -> obligation, deviations from playbook."
note = "Obligation.valid_from/valid_to state when the obligation actually binds in the world (e.g. an amended term's effective period); this is distinct from provenance (when the clause was drafted, signed, or last edited). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["legal", "clm"]

[entities.Clause]
id_prefix = "cls"
props = []
[entities.Obligation]
id_prefix = "obl"
props = []
requires_grounding = true
requires_validity = true
[entities.PlaybookPosition]
id_prefix = "pbp"
props = []

[relations.IMPOSES]
from = ["Clause"]
to = ["Obligation"]
role = "chaining"
[relations.DEVIATES_FROM]
from = ["Clause"]
to = ["PlaybookPosition"]
role = "chaining"
[relations.SUPERSEDES]
from = ["Obligation"]
to = ["Obligation"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Clause", relations = ["IMPOSES"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
