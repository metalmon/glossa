[meta]
domain = "contract"
description = "Contract lifecycle management: clause -> obligation -> party, deviations from playbook."
note = "Obligation.valid_from/valid_to state when the obligation actually binds in the world (e.g. an amended term's effective period); this is distinct from provenance (when the clause was drafted, signed, or last edited). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["legal", "clm"]

[entities.Clause]
id_prefix = "cls"
props = []
requires_grounding = true
[entities.Obligation]
id_prefix = "obl"
props = []
requires_validity = true
[entities.Party]
id_prefix = "pty"
props = []
[entities.PlaybookPosition]
id_prefix = "pbp"
props = []

[relations.IMPOSES]
from = ["Clause"]
to = ["Obligation"]
[relations.ON_PARTY]
from = ["Obligation"]
to = ["Party"]
[relations.DEVIATES_FROM]
from = ["Clause"]
to = ["PlaybookPosition"]
[relations.SUPERSEDES]
from = ["Obligation"]
to = ["Obligation"]

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Clause", relations = ["IMPOSES"] },
]
mentions = "MENTIONS"
