[meta]
domain = "competency"
description = "Competency / skills management: role -> required skill, person -> held skill, skill prerequisites."
family = "hr"
tier = 2
aliases = ["skills", "l&d"]

[entities.Role]
id_prefix = "rol"
props = []
[entities.Skill]
id_prefix = "skl"
props = []
requires_grounding = true
[entities.Person]
id_prefix = "per"
props = []

[relations.REQUIRES_SKILL]
from = ["Role"]
to = ["Skill"]
role = "chaining"
[relations.HAS_SKILL]
from = ["Person"]
to = ["Skill"]
role = "chaining"
[relations.PREREQUISITE_OF]
from = ["Skill"]
to = ["Skill"]
role = "chaining"

[validation]
strict = true

[reasoning]
closure = [["PREREQUISITE_OF", "PREREQUISITE_OF", "PREREQUISITE_OF"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
