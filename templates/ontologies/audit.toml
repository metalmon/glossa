[meta]
domain = "audit"
description = "Controls audit / GRC: control -> mitigated risk, grounded in the text."
family = "compliance"
tier = 1
aliases = ["controls", "grc"]

[entities.Control]
id_prefix = "ctl"
props = []
requires_grounding = true
[entities.Risk]
id_prefix = "rsk"
props = []

[relations.MITIGATES]
from = ["Control"]
to = ["Risk"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Control", relations = ["MITIGATES"] },
]
mentions = "MENTIONS"
