[meta]
domain = "data-privacy"
description = "Records of processing (ROPA): data -> legal basis -> retention -> processor."
note = "DataAsset.valid_from/valid_to state when the processing activity actually holds in the world (e.g. the period a data category is collected under a given basis); this is distinct from provenance (when the ROPA entry was recorded or last edited). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["ropa", "gdpr", "pii"]

[entities.DataAsset]   # a category of personal data being processed
id_prefix = "dat"
props = []
requires_grounding = true
requires_validity = true
[entities.Purpose]     # why the data is processed
id_prefix = "pur"
props = []
[entities.LegalBasis]  # the lawful basis for processing
id_prefix = "lgb"
props = []
[entities.Processor]   # who processes the data
id_prefix = "prc"
props = []
[entities.Literal]
id_prefix = "lit"
props = []

[relations.PROCESSED_FOR]
from = ["DataAsset"]
to = ["Purpose"]
role = "chaining"
[relations.HAS_LEGAL_BASIS]
from = ["DataAsset"]
to = ["LegalBasis"]
role = "chaining"
[relations.PROCESSED_BY]
from = ["DataAsset"]
to = ["Processor"]
role = "chaining"
[relations.CONSTRAINED_BY]
from = ["DataAsset"]
to = ["Range", "Required"]
role = "attribute"
[relations.HAS_MAX]
from = ["Range"]
to = ["Literal"]
role = "attribute"

[validation]
strict = true

[constraint_types.Range]
params = ["min", "max"]
[constraint_types.Required]
params = []

[reasoning]
mentions = "MENTIONS"
