[meta]
domain = "access-governance"
description = "Access governance / segregation of duties: role grants, assignments, and conflicting permission combos."
family = "compliance"
tier = 1
aliases = ["sod", "iam-gov"]

[entities.Role]
id_prefix = "rol"
props = []
[entities.Permission]
id_prefix = "prm"
props = []
[entities.Grant]
id_prefix = "grn"
props = []
requires_grounding = true

[relations.GRANTS]
from = ["Role"]
to = ["Permission"]
role = "chaining"
[relations.ASSIGNED]
from = ["Grant"]
to = ["Role"]
role = "chaining"
[relations.CONFLICTS_WITH]
from = ["Permission"]
to = ["Permission"]
role = "chaining"
[relations.CONSTRAINED_BY]
from = ["Permission"]
to = ["Forbidden"]
role = "attribute"

[validation]
strict = true

[constraint_types.Forbidden]
params = []

[reasoning]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
