[meta]
domain = "traceability"
description = "Requirements traceability matrix (QMS/ISO 9001): requirement -> design -> verifying test."
family = "traceability"
tier = 2
aliases = ["qms", "iso9001", "rtm"]

[entities.Requirement]
id_prefix = "req"
props = []
[entities.Design]
id_prefix = "dsg"
props = []
[entities.Test]
id_prefix = "tst"
props = []
requires_grounding = true

[relations.SATISFIED_BY]
from = ["Requirement"]
to = ["Design"]
role = "chaining"
[relations.VERIFIED_BY]
from = ["Design"]
to = ["Test"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Requirement", relations = ["SATISFIED_BY", "VERIFIED_BY"] },
]
mentions = "MENTIONS"
closure = [["SATISFIED_BY", "VERIFIED_BY", "VERIFIED_BY"]]

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
