[meta]
domain = "product-catalog"
description = "Product catalog: product -> feature -> plan, feature dependencies, product replacement."
family = "product"
tier = 2
aliases = ["offering", "pricing"]

[entities.Product]
id_prefix = "prd"
props = []
requires_grounding = true
[entities.Feature]
id_prefix = "ftr"
props = []
[entities.Plan]
id_prefix = "pln"
props = []

[relations.HAS_FEATURE]
from = ["Product"]
to = ["Feature"]
role = "chaining"
[relations.IN_PLAN]
from = ["Feature"]
to = ["Plan"]
role = "chaining"
[relations.REQUIRES]
from = ["Feature"]
to = ["Feature"]
role = "chaining"
[relations.REPLACES]
from = ["Product"]
to = ["Product"]
role = "chaining"

[validation]
strict = true

[reasoning]
closure = [["REQUIRES", "REQUIRES", "REQUIRES"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
