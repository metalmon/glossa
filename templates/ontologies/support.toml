[meta]
domain = "support"
description = "Troubleshooting plus documentation search: symptom -> cause -> resolution."
family = "causal"
tier = 2
aliases = ["troubleshooting", "helpdesk"]

[entities.Symptom]    # an observed problem / question class (keep BROAD)
id_prefix = "sym"
props = []
[entities.Cause]      # a root cause
id_prefix = "cau"
props = []
[entities.Resolution] # an action / fix / answer-pattern
id_prefix = "res"
props = []
requires_grounding = true
[entities.Task]       # a how-to intent
id_prefix = "tsk"
props = []

[relations.CAUSED_BY]
from = ["Symptom"]
to = ["Cause"]
role = "chaining"
[relations.RESOLVED_BY]
from = ["Cause", "Task"]
to = ["Resolution"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Symptom", relations = ["CAUSED_BY", "RESOLVED_BY"] },
  { anchor = "Task",    relations = ["RESOLVED_BY"] },
]
closure = [["CAUSED_BY", "RESOLVED_BY", "RESOLVED_BY"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
