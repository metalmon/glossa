[meta]
domain = "timeline"
description = "Event timeline / chronology: temporal ordering and causal links between events."
family = "temporal"
tier = 2
aliases = ["chronology", "history"]

[entities.Event]
id_prefix = "evt"
props = []
requires_grounding = true

[relations.BEFORE]
from = ["Event"]
to = ["Event"]
role = "chaining"
[relations.AFTER]
from = ["Event"]
to = ["Event"]
role = "chaining"
[relations.CAUSED]
from = ["Event"]
to = ["Event"]
role = "chaining"

[validation]
strict = true

[reasoning]
closure = [["BEFORE", "BEFORE", "BEFORE"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
