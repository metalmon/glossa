[meta]
domain = "hr-compliance"
description = "HR / EHS / labor compliance: role -> required record -> value constraints."
note = "Record.valid_from/valid_to state when the record holds true in the world (e.g. a certification's effective period); this is distinct from provenance (when the record was filed or last edited). Never conflate the two."
family = "compliance"
tier = 1
aliases = ["ehs", "labor"]

[entities.Role]
id_prefix = "rol"
props = []
[entities.Record]
id_prefix = "rec"
props = []
requires_grounding = true
requires_validity = true
[entities.Literal]
id_prefix = "lit"
props = []

[relations.REQUIRES_RECORD]
from = ["Role"]
to = ["Record"]
role = "chaining"
[relations.CONSTRAINED_BY]
from = ["Record"]
to = ["Required", "Range"]
role = "attribute"
[relations.HAS_MAX]
from = ["Range"]
to = ["Literal"]
role = "attribute"
[relations.SUPERSEDES]
from = ["Record"]
to = ["Record"]
role = "chaining"

[validation]
strict = true

[constraint_types.Required]
params = []
[constraint_types.Range]
params = ["min", "max"]

[reasoning]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
