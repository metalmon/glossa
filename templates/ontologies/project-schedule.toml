[meta]
domain = "project-schedule"
description = "Project schedule: milestone -> task, with task dependencies and blockers."
family = "project"
tier = 2
aliases = ["plan", "gantt"]

[entities.Milestone]
id_prefix = "mst"
props = []
[entities.Task]
id_prefix = "tsk"
props = []
requires_grounding = true

[relations.HAS_TASK]
from = ["Milestone"]
to = ["Task"]
role = "chaining"
[relations.DEPENDS_ON]
from = ["Task"]
to = ["Task"]
role = "chaining"
[relations.BLOCKS]
from = ["Task"]
to = ["Task"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Milestone", relations = ["HAS_TASK"] },
]
closure = [["DEPENDS_ON", "DEPENDS_ON", "DEPENDS_ON"]]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
