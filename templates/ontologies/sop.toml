[meta]
domain = "sop"
description = "Standard operating procedures: procedure -> ordered steps."
family = "procedural"
tier = 2
aliases = ["howto", "runbook", "onboarding"]

[entities.Procedure]
id_prefix = "prc"
props = []
[entities.Step]
id_prefix = "stp"
props = []
requires_grounding = true

[relations.HAS_STEP]
from = ["Procedure"]
to = ["Step"]
[relations.NEXT]
from = ["Step"]
to = ["Step"]

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Procedure", relations = ["HAS_STEP"] },
]
mentions = "MENTIONS"
