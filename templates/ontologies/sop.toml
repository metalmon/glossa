[meta]
domain = "sop"
description = "Standard operating procedures: procedure -> ordered steps."
family = "procedural"
tier = 2
aliases = ["howto", "runbook", "onboarding"]

[entities.Procedure]
id_prefix = "prc"
props = []
[entities.Step]
id_prefix = "stp"
props = []
requires_grounding = true

[relations.HAS_STEP]
from = ["Procedure"]
to = ["Step"]
role = "chaining"
[relations.NEXT]
from = ["Step"]
to = ["Step"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Procedure", relations = ["HAS_STEP"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
