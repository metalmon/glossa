[meta]
domain = "org-roles"
description = "Organisational structure and responsibility matrix (RACI)."
family = "hr"
tier = 2
aliases = ["org", "raci"]

[entities.Role]
id_prefix = "rol"
props = []
requires_grounding = true
[entities.Team]
id_prefix = "tea"
props = []
[entities.Process]
id_prefix = "pro"
props = []

[relations.REPORTS_TO]
from = ["Role"]
to = ["Role"]
role = "chaining"
[relations.MEMBER_OF]
from = ["Role"]
to = ["Team"]
role = "chaining"
[relations.ACCOUNTABLE_FOR]
from = ["Role"]
to = ["Process"]
role = "chaining"

[validation]
strict = true

[reasoning]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
