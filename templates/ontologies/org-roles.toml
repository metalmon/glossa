[meta]
domain = "org-roles"
description = "Organisational structure and responsibility matrix (RACI)."
family = "hr"
tier = 2
aliases = ["org", "raci"]

[entities.Role]
id_prefix = "rol"
props = []
requires_grounding = true
[entities.Team]
id_prefix = "tea"
props = []
requires_grounding = true
[entities.Process]
id_prefix = "pro"
props = []
requires_grounding = true

[relations.REPORTS_TO]
from = ["Role"]
to = ["Role"]
[relations.MEMBER_OF]
from = ["Role"]
to = ["Team"]
[relations.ACCOUNTABLE_FOR]
from = ["Role"]
to = ["Process"]

[validation]
strict = true

[reasoning]
mentions = "MENTIONS"
