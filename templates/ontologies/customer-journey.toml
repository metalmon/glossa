[meta]
domain = "customer-journey"
description = "Customer journey mapping: stage -> touchpoint, and pain points along the way."
family = "cx"
tier = 2
aliases = ["journey-map", "cx"]

[entities.Stage]
id_prefix = "stg"
props = []
[entities.Touchpoint]
id_prefix = "tp"
props = []
requires_grounding = true
[entities.PainPoint]
id_prefix = "pnp"
props = []

[relations.HAS_TOUCHPOINT]
from = ["Stage"]
to = ["Touchpoint"]
role = "chaining"
[relations.NEXT]
from = ["Stage"]
to = ["Stage"]
role = "chaining"
[relations.HAS_PAIN]
from = ["Touchpoint"]
to = ["PainPoint"]
role = "chaining"

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Stage", relations = ["HAS_TOUCHPOINT"] },
]
mentions = "MENTIONS"

# ── Retrieval tuning (optional) ──────────────────────────────────────────────
# Per-corpus retrieval weights. Uncomment to override the engine default.
# [retrieval]
# PPR transition weight of a mechanical SIMILAR edge relative to a reasoning
# edge (which is 1.0). Default 0.1. Lower = leaner similarity mass (suits a
# stronger reader model); higher = heavier (suits a weaker reader, e.g. a 4B).
# The env var GLOSSA_PPR_SIM_WEIGHT overrides this for one-off sweeps.
# sim_weight = 0.1
