[meta]
domain = "customer-journey"
description = "Customer journey mapping: stage -> touchpoint -> channel, and pain points along the way."
family = "cx"
tier = 2
aliases = ["journey-map", "cx"]

[entities.Stage]
id_prefix = "stg"
props = []
[entities.Touchpoint]
id_prefix = "tp"
props = []
requires_grounding = true
[entities.Channel]
id_prefix = "chn"
props = []
[entities.PainPoint]
id_prefix = "pnp"
props = []

[relations.HAS_TOUCHPOINT]
from = ["Stage"]
to = ["Touchpoint"]
[relations.ON_CHANNEL]
from = ["Touchpoint"]
to = ["Channel"]
[relations.NEXT]
from = ["Stage"]
to = ["Stage"]
[relations.HAS_PAIN]
from = ["Touchpoint"]
to = ["PainPoint"]

[validation]
strict = true

[reasoning]
spines = [
  { anchor = "Stage", relations = ["HAS_TOUCHPOINT"] },
]
mentions = "MENTIONS"
